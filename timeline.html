<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline · The Fred again.. Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#08080c; --ink:#f3efe7; --muted:#8d8a95; --line:#2a2833; --card:#121119; --fred:#ff5a36; --era:#5b6475; }
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column}
  #glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 50% 55%, color-mix(in srgb,var(--era) 22%,transparent), transparent 70%);transition:background 1.2s}
  header{position:relative;z-index:10;background:#08080cd0;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:baseline;gap:16px}
  .brand h1{font-family:"Space Grotesk";font-size:22px;margin:0;letter-spacing:-.02em}
  .brand h1 span{color:var(--fred)}
  nav a{color:var(--muted);text-decoration:none;font-size:14px;margin-right:12px}
  nav a.on{color:var(--ink);border-bottom:2px solid var(--fred);padding-bottom:2px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  #search{background:#13121a;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;width:200px;outline:none}
  .chip{border:1px solid var(--line);background:#13121a;color:var(--ink);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;user-select:none}
  .chip.off{opacity:.35}
  .chip i{width:9px;height:9px;display:inline-block}

  /* era strip: where you are + jump to an era */
  #eras{position:relative;z-index:9;display:flex;gap:6px;padding:10px 22px;overflow-x:auto;scrollbar-width:none}
  .erabtn{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;background:#100f16;font-size:12px;cursor:pointer;color:var(--muted);transition:all .4s}
  .erabtn img,.erabtn b{width:22px;height:22px;border-radius:50%;object-fit:cover;background:var(--c)}
  .erabtn.on{color:var(--ink);border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,#100f16)}
  #follow{display:none;position:relative;z-index:9;margin:0 22px 6px;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:#17151f;font-size:13px}
  #follow button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:3px 10px;margin-left:8px;cursor:pointer}

  /* the horizontal ride */
  #ride{position:relative;flex:1;overflow-x:auto;overflow-y:hidden;scrollbar-color:#3a3745 transparent}
  #track{position:relative;height:100%;display:flex;align-items:stretch;padding:0 45vw 0 8vw;min-width:max-content}
  #track::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:linear-gradient(90deg,transparent,#3a3745 4%,#3a3745 96%,transparent)}
  .era{position:relative;display:flex;align-items:stretch;padding:0 60px 0 20px;border-left:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--c) 7%,transparent) 50%,transparent)}
  .eratitle{position:absolute;top:14px;left:22px;font-family:"Space Grotesk";font-weight:700;font-size:40px;letter-spacing:-.03em;color:var(--c);opacity:.9;white-space:nowrap;pointer-events:none}
  .eratitle small{display:block;font-family:Inter;font-weight:400;font-size:12px;letter-spacing:0;color:var(--muted);max-width:340px;white-space:normal;margin-top:2px}
  .eraspace{flex:none;width:360px}
  .year{position:relative;flex:none;width:90px;display:flex;align-items:center;justify-content:center}
  .year span{font-family:"Space Grotesk";font-weight:700;font-size:30px;background:var(--bg);padding:2px 8px;border-radius:8px;border:1px solid var(--line);z-index:1}
  .col{position:relative;flex:none;width:230px;margin-right:-105px;height:100%;display:flex;flex-direction:column}
  .col .slot{height:50%;display:flex;flex-direction:column;padding:0 0 22px}
  .col.up .slot{justify-content:flex-end}
  .col.down .slot{margin-top:auto;justify-content:flex-start;padding:22px 0 0}
  .col .stem{position:absolute;left:18px;width:1px;background:#3a3745}
  .col.up .stem{top:calc(50% - 22px);height:22px}
  .col.down .stem{top:50%;height:22px}
  .col .pin{position:absolute;left:12px;top:calc(50% - 6px);width:13px;height:13px;z-index:2}
  .item{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;transition:border-color .3s, box-shadow .3s, transform .2s;max-height:calc(50vh - 120px);overflow:auto;scrollbar-width:none}
  .item:hover{transform:translateY(-2px);border-color:#4a4656;z-index:3}
  .item.flash{border-color:var(--fred);box-shadow:0 0 0 3px #ff5a3633}
  .item.mini{padding:6px 10px;border-radius:9px;background:#0f0e15}
  .thumb{width:100%;aspect-ratio:1;max-height:150px;border-radius:7px;position:relative;overflow:hidden;display:grid;place-items:center;font-family:"Space Grotesk";font-weight:700;font-size:26px;margin-bottom:8px}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .meta{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
  .title{font-family:"Space Grotesk";font-size:16px;font-weight:700;margin:2px 0 3px;letter-spacing:-.01em;line-height:1.2}
  .mini .title{font-size:13px}
  .date{color:var(--muted)}
  .flag{height:10px;border-radius:2px;vertical-align:-1px;margin-left:4px;box-shadow:0 0 0 1px #0006}
  .where{color:var(--muted);font-size:11.5px;margin-top:1px}
  .story{font-size:12.5px;line-height:1.45;margin:6px 0 2px;color:#d9d4cc}
  .pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .pill{background:#1c1a24;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:11px;cursor:pointer;color:var(--ink)}
  .pill:hover{border-color:#5a5668}
  .pill.back{border-style:dashed;color:#e9c8ff}
  .pill.fwd{border-style:dashed;color:#bfe7ff}
  .actions{margin-top:6px;font-size:11px}
  .actions a{color:var(--muted);margin-right:10px}
  .unv{border-style:dashed}
  #empty{position:fixed;top:50%;width:100%;color:var(--muted);text-align:center;display:none}
  #hint{position:fixed;bottom:14px;right:22px;font-size:12px;color:var(--muted);z-index:9;pointer-events:none}
  @media(max-width:640px){#search{width:100%}.eratitle{font-size:28px}.col{width:200px;margin-right:-90px}}
</style>
</head>
<body>
<div id="glow"></div>
<header>
  <div class="brand">
    <h1>The <span>Fred again..</span> Universe</h1>
    <nav><a href="index.html">Web</a><a href="timeline.html" class="on">Timeline</a></nav>
  </div>
  <div class="controls">
    <input id="search" placeholder="Search…" autocomplete="off">
    <span id="chips"></span>
  </div>
</header>
<div id="eras"></div>
<div id="follow"></div>
<div id="ride"><div id="track"></div></div>
<p id="empty">Nothing matches these filters.</p>
<div id="hint">scroll to ride through time →</div>
<script src="timeline.js"></script>
</body>
</html>
