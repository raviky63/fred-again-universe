<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Readability prototypes · The Fred again.. Universe</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root{--bg:#08080c;--ink:#f3efe7;--muted:#8d8a95;--line:#2a2833;--fred:#ff5a36}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
  #bar{position:fixed;top:0;left:0;right:0;z-index:5;padding:12px 18px;background:#08080ce6;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  h1{font-family:"Space Grotesk";font-size:18px;margin:0 0 8px} h1 span{color:var(--fred)} h1 a{color:var(--muted);font:400 13px Inter;margin-left:12px}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
  .row b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
  .t{border:1px solid var(--line);background:#13121a;color:var(--ink);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;user-select:none}
  .t.on{border-color:var(--fred);background:#2a1510}
  .p{border-style:dashed}
  #desc{font-size:12.5px;color:#cfc9bf;margin-top:8px;max-width:980px;line-height:1.45}
  svg{width:100%;height:100%;display:block;cursor:grab} svg:active{cursor:grabbing}
  .lab{font-size:10.5px;fill:#cfd8e3;pointer-events:none;paint-order:stroke;stroke:#08080c;stroke-width:3px}
  .link{stroke:#fff;stroke-opacity:.13}
  #story{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:6;display:none;max-width:560px;width:calc(100% - 40px);background:#141320f0;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  #story h3{margin:0 0 4px;font-family:"Space Grotesk"} #story p{margin:0 0 10px;font-size:13.5px;color:#d9d4cc;line-height:1.45}
  #story .nav{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
  #story button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
  #hint{position:fixed;right:16px;bottom:14px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="bar">
  <h1>Readability prototypes <span>·</span> pick what feels right <a href="index.html">← back to the web</a></h1>
  <div class="row"><b>Ideas</b><span id="toggles"></span></div>
  <div class="row"><b>Try a combo</b><span id="presets"></span></div>
  <div id="desc"></div>
</div>
<svg id="svg"></svg>
<div id="story"><h3 id="sT"></h3><p id="sP"></p><div class="nav"><button id="prev">← back</button><span id="sN"></span><button id="next">next →</button></div></div>
<div id="hint">drag to move · scroll to zoom · click to open</div>
<script>
const IDEAS = {
  collapse:{n:"1 · Open & close", d:"You start with Fred, the eras and the albums. Click an era or album to open what's inside (tracks, artists, shows). Click again to close."},
  labels:{n:"2 · Names on zoom", d:"Names only show for big nodes, for what you hover, and for everything once you zoom in."},
  tours:{n:"3 · Shows per tour", d:"Shows are bundled into one node per tour (USB002, Places We've Never Been…) or per year of festivals, with the flags of the countries around it. Click to open the shows."},
  size:{n:"4 · Size = how often", d:"Artists grow with how often they worked with Fred. One-off collaborators become small dots without a name."},
  story:{n:"5 · Story mode", d:"A guided walk past the key moments, one at a time, with a short text. Good for first-time visitors."},
  eras:{n:"6 · Era colours", d:"Everything gets the colour of its era, so you see at a glance what belongs to Actual Life, ten days, USB002…"}
};
const PRESETS = [
  ["Now (nothing on)", []],
  ["1 + 3", ["collapse","tours"]],
  ["2 + 4 + 6", ["labels","size","eras"]],
  ["Recommended: 1 + 2 + 3 + 4 + 6", ["collapse","labels","tours","size","eras"]],
  ["Recommended + story", ["collapse","labels","tours","size","eras","story"]]
];
const on = new Set(["collapse","tours"]);
const TOURS = [
  ["North America 2022","2022-09-23","2022-10-29"],["Actual Life 3 tour (Europe)","2022-11-09","2022-12-09"],
  ["London, three nights with Skrillex & Four Tet","2023-01-05","2023-01-07"],["Australia & NZ 2023","2023-01-25","2023-02-13"],
  ["New York week, Feb 2023","2023-02-14","2023-02-18"],["Ally Pally & Europe 2023","2023-09-04","2023-09-21"],
  ["US autumn 2023","2023-10-12","2023-11-03"],["Australia & NZ 2024","2024-02-26","2024-03-30"],
  ["places we've never been","2024-09-09","2024-10-14"],["Asia 2025","2025-07-21","2025-07-31"],["Italy summer 2025","2025-09-04","2025-09-12"],
  ["USB002","2025-10-03","2026-02-27"]
];
const STORY = ["actual-life","boiler-room-2022","actual-life-3","msg-2023","grammys-2024","la-coliseum-2024","ten-days","usb002-glasgow","bangalter-2026","nine-months"];
const flagUrl = cc => `https://flagcdn.com/w40/${cc.toLowerCase()}.png`;
const FILES = ["center","artists","releases","tracks","events","eras"];
Promise.all(FILES.map(f=>fetch(`data/${f}.json`).then(r=>r.json()))).then(p=>build(Object.fromEntries(FILES.map((f,i)=>[f,p[i]]))));

function build(D){
  const eras = D.eras.slice().sort((a,b)=>a.start.localeCompare(b.start));
  const eraOf = d => { let e=eras[0]; for(const x of eras) if((d||"9999")>=x.start) e=x; return e; };
  const all = {}, edges = [];
  const add = n => all[n.id]=n;
  const c = D.center;
  add({id:c.id,type:"fred",name:"Fred again..",img:c.photo,r:34});
  eras.forEach(e=>add({id:"era-"+e.id,type:"era",name:e.name,era:e,r:20}));
  const cover = {}; D.releases.forEach(r=>cover[r.id]=r.cover);
  D.releases.forEach(r=>add({id:r.id,type:"release",name:r.title.replace(/\s*\(.*\)$/,""),img:r.cover,era:eraOf(r.date),big:["album","mixtape"].includes(r.kind),r:r.kind==="album"?16:10,raw:r}));
  D.tracks.forEach(t=>add({id:t.id,type:"track",name:t.title.replace(/\s*\(.*\)$/,""),img:t.cover||cover[(t.releases||[])[0]],era:eraOf(t.date),r:6,raw:t}));
  D.artists.forEach(a=>add({id:a.id,type:"artist",name:a.name,img:a.photo,r:8,deg:0,raw:a}));
  D.events.forEach(e=>add({id:e.id,type:"event",name:e.title,era:eraOf(e.date),r:6,raw:e,cc:(e.country||[])[0]}));
  // groups of shows: tours, else festivals / shows per year
  D.events.forEach(e=>{
    const t = TOURS.find(([n,a,b])=>e.date>=a && e.date<=b);
    const gid = t ? "tour-"+t[0] : `y-${e.date.slice(0,4)}-${e.kind==="mix"?"mix":e.setting==="festival"?"fest":"show"}`;
    const gname = t ? t[0] : `${e.date.slice(0,4)} · ${e.kind==="mix"?"mixes & radio":e.setting==="festival"?"festivals":"other shows"}`;
    if(!all[gid]) add({id:gid,type:"group",name:gname,era:eraOf(e.date),r:12,kids:[],ccs:new Set()});
    all[gid].kids.push(e.id); if(e.country) e.country.forEach(x=>all[gid].ccs.add(x)); all[e.id].group=gid;
  });
  Object.values(all).filter(n=>n.type==="group").forEach(g=>{ g.name+=` · ${g.kids.length}`; g.r=Math.min(20,9+Math.sqrt(g.kids.length)*1.6); });
  const E = (a,b)=>{ if(all[a]&&all[b]) edges.push([a,b]); };
  D.releases.forEach(r=>{(r.with||[]).forEach(w=>E(r.id,w)); (r.tracks||[]).forEach(t=>E(r.id,t));});
  D.tracks.forEach(t=>(t.with||[]).forEach(w=>E(t.id,w)));
  D.events.forEach(e=>{(e.with||[]).forEach(w=>E(e.id,w));});
  edges.forEach(([a,b])=>{ if(all[b]?.type==="artist") all[b].deg++; if(all[a]?.type==="artist") all[a].deg++; });
  // a home for every node (used by "open & close")
  const parent = {};
  D.releases.forEach(r=>parent[r.id]=r.part_of||"era-"+all[r.id].era.id);
  D.tracks.forEach(t=>parent[t.id]=(t.releases||[])[0]||"era-"+all[t.id].era.id);
  D.events.forEach(e=>parent[e.id]=all[e.id].group);
  Object.values(all).filter(n=>n.type==="group").forEach(g=>parent[g.id]="era-"+g.era.id);
  D.artists.forEach(a=>{ const nb=edges.filter(([x,y])=>y===a.id||x===a.id).map(([x,y])=>x===a.id?y:x); parent[a.id]=nb.sort((p,q)=>(all[p].type==="release"?0:1)-(all[q].type==="release"?0:1))[0]; });
  const expanded = new Set();

  // ---------- svg ----------
  const svg=d3.select("#svg"), world=svg.append("g"), defs=svg.append("defs");
  const gL=world.append("g"), gN=world.append("g");
  let k=1;
  const zoom=d3.zoom().scaleExtent([.15,5]).on("zoom",e=>{world.attr("transform",e.transform); k=e.transform.k; labels();});
  svg.call(zoom).on("dblclick.zoom",null);
  const sim=d3.forceSimulation().force("charge",d3.forceManyBody().strength(d=>d.type==="fred"?-900:d.type==="era"?-500:d.type==="group"?-260:-120))
    .force("link",d3.forceLink().id(d=>d.id).distance(l=>l.kind==="home"?(l.target.type==="era"?220:l.target.type==="group"?90:60):70).strength(l=>l.kind==="home"?.6:.15))
    .force("collide",d3.forceCollide().radius(d=>rad(d)+4)).force("x",d3.forceX(0).strength(.03)).force("y",d3.forceY(0).strength(.03));
  all[c.id].fx=0; all[c.id].fy=0;

  function rad(d){ if(d.type==="artist" && on.has("size")) return 4+Math.min(d.deg,10)*1.6; return d.r; }
  function eraCol(d){ return d.type==="era"?d.era.color:d.era?.color; }
  function visible(){
    const v=new Set([c.id]);
    const showGroups=on.has("tours");
    for(const n of Object.values(all)){
      if(n.type==="fred") continue;
      if(n.type==="era"){ if(on.has("collapse")||on.has("eras")||showGroups) v.add(n.id); continue; }
      if(n.type==="group"){ if(showGroups) v.add(n.id); continue; }
      if(n.type==="event" && showGroups && !expanded.has(n.group)) continue;
      if(on.has("collapse")){
        if(n.type==="release" && n.big) { v.add(n.id); continue; }
        if(n.type==="artist") continue; // handled below
        const p=parent[n.id]; if(p && expanded.has(p)) v.add(n.id);
        continue;
      }
      if(n.type!=="artist") v.add(n.id);
    }
    // artists: visible when something they're linked to is visible (and, in open & close mode, opened)
    for(const n of Object.values(all)) if(n.type==="artist"){
      const nb=edges.filter(([x,y])=>x===n.id||y===n.id).map(([x,y])=>x===n.id?y:x);
      if(nb.some(id=>v.has(id) && (!on.has("collapse") || expanded.has(id) || all[id].type==="event"))) v.add(n.id);
    }
    return v;
  }
  function homeOf(n,v){
    if(n.type==="era"||(n.type==="group"&&!v.has(parent[n.id]))) return c.id;
    if(n.type==="release" && (on.has("collapse")||on.has("eras")) && v.has("era-"+n.era.id) && !n.raw.part_of) return "era-"+n.era.id;
    const p=parent[n.id]; if(p && v.has(p)) return p;
    if(n.type==="event" && n.group && v.has(n.group)) return n.group;
    if(["release","event","group"].includes(n.type)) return c.id;
    return null;
  }
  function render(){
    const v=visible(), nodes=[...v].map(id=>all[id]);
    const links=[];
    nodes.forEach(n=>{ const h=homeOf(n,v); if(h&&v.has(h)&&h!==n.id) links.push({source:h,target:n.id,kind:"home"}); });
    edges.forEach(([a,b])=>{ if(v.has(a)&&v.has(b)) links.push({source:a,target:b,kind:"with"}); });
    // place new nodes near their home so they "open" out of it
    nodes.forEach(n=>{ if(n.x==null){ const h=all[homeOf(n,v)]||all[c.id]; n.x=(h.x||0)+(Math.random()-.5)*30; n.y=(h.y||0)+(Math.random()-.5)*30; } });
    const ls=gL.selectAll("line").data(links,d=>(d.source.id||d.source)+">"+(d.target.id||d.target));
    ls.exit().remove(); ls.enter().append("line").attr("class","link");
    const ns=gN.selectAll("g.n").data(nodes,d=>d.id);
    ns.exit().transition().duration(250).style("opacity",0).remove();
    const ne=ns.enter().append("g").attr("class","n").style("cursor","pointer").style("opacity",0)
      .on("click",(e,d)=>{ e.stopPropagation(); if(on.has("collapse")||d.type==="group"){ expanded.has(d.id)?expanded.delete(d.id):expanded.add(d.id); render(); } })
      .on("mouseenter",(e,d)=>{ hover=d.id; labels(); }).on("mouseleave",()=>{ hover=null; labels(); })
      .call(d3.drag().on("start",(e,d)=>{ if(!e.active) sim.alphaTarget(.2).restart(); d.fx=d.x; d.fy=d.y; })
        .on("drag",(e,d)=>{ d.fx=e.x; d.fy=e.y; }).on("end",(e,d)=>{ if(!e.active) sim.alphaTarget(0); if(d.type!=="fred"){ d.fx=null; d.fy=null; } }));
    ne.transition().duration(400).style("opacity",1);
    ne.each(function(d){ const g=d3.select(this); g.append("g").attr("class","shape"); g.append("text").attr("class","lab").attr("text-anchor","middle"); });
    gN.selectAll("g.n").each(function(d){ draw(d3.select(this),d); });
    sim.nodes(nodes); sim.force("link").links(links); sim.alpha(.7).restart();
    labels();
  }
  let hover=null;
  function draw(g,d){
    const s=g.select(".shape").html(""); const r=rad(d), col=on.has("eras")?eraCol(d)||"#fff":null;
    const clip=(shape)=>{ const id="cp"+d.id.replace(/[^a-z0-9]/gi,""); if(!document.getElementById(id)) shape(defs.append("clipPath").attr("id",id)); return `url(#${id})`; };
    if(d.type==="fred"){ s.append("circle").attr("r",r).attr("fill",getComputedStyle(document.body).getPropertyValue("--fred"));
      if(d.img) s.append("image").attr("href",d.img).attr("x",-r).attr("y",-r).attr("width",2*r).attr("height",2*r).attr("preserveAspectRatio","xMidYMid slice").attr("clip-path",clip(cp=>cp.append("circle").attr("r",r)));
      s.append("circle").attr("r",r).attr("fill","none").attr("stroke","#ff5a36").attr("stroke-width",3); }
    else if(d.type==="era"){ s.append("circle").attr("r",r).attr("fill",(on.has("eras")?d.era.color:"#222")+"33").attr("stroke",on.has("eras")?d.era.color:"#888").attr("stroke-width",2).attr("stroke-dasharray",expanded.has(d.id)?null:"3 3"); }
    else if(d.type==="group"){ s.append("circle").attr("r",r).attr("fill","#15141c").attr("stroke",col||"#fff").attr("stroke-width",1.5).attr("stroke-dasharray",expanded.has(d.id)?null:"2 3");
      [...d.ccs].slice(0,8).forEach((cc,i,a)=>{ const ang=-Math.PI/2+i*2*Math.PI/Math.max(a.length,1); s.append("image").attr("href",flagUrl(cc)).attr("x",Math.cos(ang)*(r+7)-6).attr("y",Math.sin(ang)*(r+7)-4).attr("width",12).attr("height",8).attr("preserveAspectRatio","none"); });
      s.append("text").attr("text-anchor","middle").attr("dy",".35em").attr("font-size",10).attr("fill","#fff").text(d.kids.length); }
    else if(d.type==="artist"){ const rr=r; s.append("circle").attr("r",rr).attr("fill","#0f1620");
      if(d.img && rr>6) s.append("image").attr("href",d.img).attr("x",-rr).attr("y",-rr).attr("width",2*rr).attr("height",2*rr).attr("preserveAspectRatio","xMidYMid slice").attr("clip-path",clip(cp=>cp.append("circle").attr("r",rr)));
      s.append("circle").attr("r",rr).attr("fill","none").attr("stroke",col||"#7cc6ff").attr("stroke-width",1.5); }
    else if(d.type==="event"){ const p=`0,${-r*1.3} ${r*1.3},0 0,${r*1.3} ${-r*1.3},0`; s.append("polygon").attr("points",p).attr("fill","#ddd");
      if(d.cc) s.append("image").attr("href",flagUrl(d.cc)).attr("x",-r*.92).attr("y",-r*.92).attr("width",r*1.84).attr("height",r*1.84).attr("preserveAspectRatio","none").attr("transform","rotate(45)");
      s.append("polygon").attr("points",p).attr("fill","none").attr("stroke",col||"#fff"); }
    else { s.append("rect").attr("x",-r).attr("y",-r).attr("width",2*r).attr("height",2*r).attr("rx",2).attr("fill","#2a2a33");
      if(d.img) s.append("image").attr("href",d.img).attr("x",-r).attr("y",-r).attr("width",2*r).attr("height",2*r);
      s.append("rect").attr("x",-r).attr("y",-r).attr("width",2*r).attr("height",2*r).attr("rx",2).attr("fill","none").attr("stroke",col||(d.type==="track"?"#ffb38a":"#ffd166")).attr("stroke-width",d.type==="release"&&expanded.has(d.id)?2.5:1.2); }
    g.select(".lab").attr("y",rad(d)+(d.type==="event"?12:11)).text(d.name.length>32?d.name.slice(0,30)+"…":d.name);
  }
  function labels(){
    gN.selectAll("g.n").select(".lab").style("display",d=>{
      if(!on.has("labels") && !on.has("size")) return null;
      if(d.id===hover || ["fred","era","group"].includes(d.type)) return null;
      if(on.has("size") && d.type==="artist" && d.deg<3 && k<2) return "none";
      if(on.has("labels")){ const big=(d.type==="release"&&d.big)||(d.type==="artist"&&d.deg>=4); if(big && k>.6) return null; return k>1.6?null:"none"; }
      return null;
    });
  }
  sim.on("tick",()=>{
    gL.selectAll("line").attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y).attr("stroke-opacity",d=>d.kind==="home"?.22:.1);
    gN.selectAll("g.n").attr("transform",d=>`translate(${d.x},${d.y})`);
  });
  const W=()=>svg.node().clientWidth, H=()=>svg.node().clientHeight;
  svg.call(zoom.transform,d3.zoomIdentity.translate(W()/2,H()/2+60).scale(.7));

  // ---------- story ----------
  let si=0; const steps=STORY.filter(id=>all[id]);
  const storyText = id => { const n=all[id], r=n.raw||{}; return (r.story||n.era?.note||"").slice(0,260); };
  function showStep(){
    const id=steps[si], n=all[id];
    // make sure it is visible
    let p=parent[id]; while(p){ expanded.add(p); p=parent[p]; }
    if(n.group) expanded.add(n.group);
    render();
    document.getElementById("sT").textContent=n.name; document.getElementById("sP").textContent=storyText(id)||"";
    document.getElementById("sN").textContent=`${si+1} / ${steps.length}`;
    setTimeout(()=>svg.transition().duration(900).call(zoom.transform,d3.zoomIdentity.translate(W()/2,H()/2+40).scale(1.6).translate(-(n.x||0),-(n.y||0))),450);
    hover=id; labels();
  }
  document.getElementById("next").onclick=()=>{ si=(si+1)%steps.length; showStep(); };
  document.getElementById("prev").onclick=()=>{ si=(si-1+steps.length)%steps.length; showStep(); };

  // ---------- controls ----------
  const tg=document.getElementById("toggles"), pr=document.getElementById("presets");
  function sync(){
    tg.querySelectorAll(".t").forEach(b=>b.classList.toggle("on",on.has(b.dataset.k)));
    document.getElementById("desc").innerHTML=[...on].map(x=>`<b>${IDEAS[x].n}:</b> ${IDEAS[x].d}`).join("<br>")||"Nothing on: this is roughly how the web works now, everything at once.";
    document.getElementById("story").style.display=on.has("story")?"block":"none";
  }
  Object.entries(IDEAS).forEach(([k2,v])=>{ const b=document.createElement("span"); b.className="t"; b.dataset.k=k2; b.textContent=v.n;
    b.onclick=()=>{ on.has(k2)?on.delete(k2):on.add(k2); expanded.clear(); sync(); render(); if(k2==="story"&&on.has("story")){ si=0; showStep(); } }; tg.appendChild(b); });
  PRESETS.forEach(([name,list])=>{ const b=document.createElement("span"); b.className="t p"; b.textContent=name;
    b.onclick=()=>{ on.clear(); list.forEach(x=>on.add(x)); expanded.clear(); sync(); render(); if(on.has("story")){ si=0; showStep(); } }; pr.appendChild(b); });
  svg.on("click",()=>{});
  sync(); render();
}
</script>
</body>
</html>
